version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: discord-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: discord_bot
      POSTGRES_PASSWORD: discord_bot_password
      POSTGRES_DB: discord_bot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: discord-bot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: discord-bot-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://discord_bot:discord_bot_password@postgres:5432/discord_bot_db
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api:/app/apps/api
      - /app/node_modules
      - /app/apps/api/node_modules

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: discord-bot
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - API_URL=http://api:4000
    env_file:
      - .env
    volumes:
      - ./apps/bot:/app/apps/bot
      - /app/node_modules
      - /app/apps/bot/node_modules

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: discord-bot-dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./apps/dashboard:/app/apps/dashboard
      - /app/node_modules
      - /app/apps/dashboard/node_modules
      - /app/apps/dashboard/.next

volumes:
  postgres_data:
  redis_data:
